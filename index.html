<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f172a">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>">
<title>DESAFIO 10.000</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    color: #fff;
    min-height: 100vh;
    padding: 12px;
    padding-bottom: 100px;
  }
  header {
    text-align:center;
    padding: 14px 8px;
    margin-bottom: 12px;
    background: rgba(255,255,255,0.05);
    border-radius: 14px;
    backdrop-filter: blur(10px);
  }
  header h1 { font-size: 1.3rem; margin-bottom: 6px; }
  .stats { display:flex; justify-content:space-around; font-size:0.95rem; flex-wrap:wrap; gap:8px; }
  .stats div span { display:block; font-size:1.4rem; font-weight:bold; color:#22c55e; }
  .stats div.sum span { color:#fbbf24; }
  .actions { display:flex; gap:8px; margin-top:10px; justify-content:center; flex-wrap:wrap; }
  button {
    background: #334155; color:#fff; border:none;
    padding: 10px 16px; border-radius: 10px; font-size:0.9rem;
    cursor:pointer; font-weight:600;
  }
  button.danger { background:#dc2626; }
  button:active { transform:scale(0.96); }
  button.hidden { display:none; }

  .grid {
    display:grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
  }
  .cell {
    aspect-ratio: 1/1;
    background: #334155;
    border-radius: 10px;
    display:flex; align-items:center; justify-content:center;
    font-weight:700;
    font-size: clamp(0.85rem, 3.5vw, 1.1rem);
    color:#e2e8f0;
    cursor:pointer;
    transition: all 0.15s ease;
    user-select:none;
    border: 2px solid transparent;
  }
  .cell:active { transform: scale(0.92); }
  .cell.highlight {
    color: #ef4444;
    text-shadow: 0 0 6px rgba(239,68,68,0.4);
  }
  .cell.checked {
    background: linear-gradient(135deg, #22c55e, #16a34a);
    color: #fff;
    border-color: #86efac;
    box-shadow: 0 0 12px rgba(34,197,94,0.5);
  }

  @media (min-width: 600px) {
    .grid { grid-template-columns: repeat(10, 1fr); }
  }
</style>
</head>
<body>
  <header>
    <h1>🏆 DESAFIO 10.000</h1>
    <div class="stats">
      <div>Total: <span id="total">44</span></div>
      <div>Feitos: <span id="done">0</span></div>
      <div>Faltam: <span id="left">44</span></div>
      <div class="sum">Soma: <span id="sum">0</span></div>
    </div>
    <div class="actions">
      <button class="hidden" onclick="exportar()">📤 Exportar</button>
      <button class="danger" onclick="resetar()">🗑️ Resetar</button>
    </div>
  </header>

  <div class="grid" id="grid"></div>

<script>
  // Sequência calculada para somar exatamente 10.000
  // Múltiplos de 10 até 440, com duas vezes o 200 e sem o 100.
  const VALUES = [
    10, 20, 30, 40, 50, 60, 70, 80, 90,
    110, 120, 130, 140, 150, 160, 170, 180, 190,
    200, 200,
    210, 220, 230, 240, 250, 260, 270, 280, 290,
    300, 310, 320, 330, 340, 350, 360, 370, 380, 390,
    400, 410, 420, 430, 440
  ];
  
  const STORAGE_KEY = 'desafio_10000_v1';
  const grid = document.getElementById('grid');
  const totalEl = document.getElementById('total');
  const doneEl = document.getElementById('done');
  const leftEl = document.getElementById('left');
  const sumEl = document.getElementById('sum');

  let state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');

  function render() {
    grid.innerHTML = '';
    let count = 0;
    let sum = 0;
    
    for (let idx = 0; idx < VALUES.length; idx++) {
      const val = VALUES[idx];
      const cell = document.createElement('div');
      let classes = 'cell';
      
      if (state[idx]) {
        classes += ' checked';
        count++;
        sum += val;
      }
      
      cell.className = classes;
      cell.textContent = val;
      cell.onclick = () => toggle(idx);
      grid.appendChild(cell);
    }
    
    totalEl.textContent = VALUES.length;
    doneEl.textContent = count;
    leftEl.textContent = VALUES.length - count;
    sumEl.textContent = sum.toLocaleString('pt-BR');
    
    // Mostra botão de exportar se houver pelo menos um item marcado
    const exportBtn = document.querySelector('button[onclick="exportar()"]');
    if (count > 0) {
      exportBtn.classList.remove('hidden');
    } else {
      exportBtn.classList.add('hidden');
    }
  }

  function toggle(idx) {
    if (state[idx]) {
      delete state[idx];
    } else {
      state[idx] = true;
    }
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    render();
  }

  function resetar() {
    if (confirm('Tem certeza que quer apagar TUDO?')) {
      state = {};
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      render();
    }
  }

  function exportar() {
    const indicesFeitos = Object.keys(state).map(idx => 'Meta #' + VALUES[idx]);
    const feitos = indicesFeitos.join('\n') || 'Nenhum registro feito.';
    const count = Object.keys(state).length;
    const sum = Object.keys(state).reduce((acc, idx) => acc + VALUES[idx], 0);
    
    const txt = 'RELATÓRIO DO DESAFIO 10.000\nData: ' + new Date().toLocaleString('pt-BR') +
                '\nTotal de metas: ' + count + '/' + VALUES.length +
                '\nSoma dos valores: ' + sum.toLocaleString('pt-BR') +
                '\n\n' + feitos;
                
    const blob = new Blob([txt], {type:'text/plain'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'desafio_10000_' + Date.now() + '.txt';
    a.click();
  }

  render();
</script>
</body>
</html>
