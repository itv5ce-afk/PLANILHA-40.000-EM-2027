<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f172a">
<link rel="icon" type="image/png" href="favicon.png"><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈 </text></svg>">
<title>DESAFIO 40.000</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    color: #fff;
    min-height: 100vh;
    padding: 12px;
    padding-bottom: 100px;
  }
  header {
    text-align:center;
    padding: 14px 8px;
    margin-bottom: 12px;
    background: rgba(255,255,255,0.05);
    border-radius: 14px;
    backdrop-filter: blur(10px);
  }
  header h1 { font-size: 1.3rem; margin-bottom: 6px; }
  .stats { display:flex; justify-content:space-around; font-size:0.95rem; flex-wrap:wrap; gap:8px; }
  .stats div span { display:block; font-size:1.4rem; font-weight:bold; color:#22c55e; }
  .stats div.sum span { color:#fbbf24; }
  .actions { display:flex; gap:8px; margin-top:10px; justify-content:center; flex-wrap:wrap; }
  button {
    background: #334155; color:#fff; border:none;
    padding: 10px 16px; border-radius: 10px; font-size:0.9rem;
    cursor:pointer; font-weight:600;
  }
  button.danger { background:#dc2626; }
  button:active { transform:scale(0.96); }
  button.hidden { display:none; }

  .grid {
    display:grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
  }
  .cell {
    aspect-ratio: 1/1;
    background: #334155;
    border-radius: 10px;
    display:flex; align-items:center; justify-content:center;
    font-weight:700;
    font-size: clamp(0.85rem, 3.5vw, 1.1rem);
    color:#e2e8f0;
    cursor:pointer;
    transition: all 0.15s ease;
    user-select:none;
    border: 2px solid transparent;
  }
  .cell:active { transform: scale(0.92); }
  .cell.highlight {
    color: #ef4444;
    text-shadow: 0 0 6px rgba(239,68,68,0.4);
  }
  .cell.checked {
    background: linear-gradient(135deg, #22c55e, #16a34a);
    color: #fff;
    border-color: #86efac;
    box-shadow: 0 0 12px rgba(34,197,94,0.5);
  }

  @media (min-width: 600px) {
    .grid { grid-template-columns: repeat(10, 1fr); }
  }
</style>
</head>
<body>
  <header>
    <h1>💰 DESAFIO 40.000</h1>
    <div class="stats">
      <div>Total: <span id="total">283</span></div>
      <div>Feitos: <span id="done">0</span></div>
      <div>Faltam: <span id="left">283</span></div>
      <div class="sum">Soma: <span id="sum">0</span></div>
    </div>
    <div class="actions">
      <button class="hidden" onclick="exportar()">📤 Exportar</button>
      <button class="danger" onclick="resetar()">🗑️ Resetar</button>
    </div>
  </header>

  <div class="grid" id="grid"></div>

<script>
  const TOTAL = 283;
  const STORAGE_KEY = 'depositos_v1';
  const grid = document.getElementById('grid');
  const doneEl = document.getElementById('done');
  const leftEl = document.getElementById('left');
  const sumEl = document.getElementById('sum');

  let state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');

  function render() {
    grid.innerHTML = '';
    let count = 0;
    let sum = 0;
    for (let i = 1; i <= TOTAL; i++) {
      const cell = document.createElement('div');
      let classes = 'cell';
      if (state[i]) classes += ' checked';
      else if (i === 186) classes += ' highlight';
      cell.className = classes;
      cell.textContent = i;
      cell.onclick = () => toggle(i);
      grid.appendChild(cell);
      if (state[i]) {
        count++;
        sum += i;
      }
    }
    doneEl.textContent = count;
    leftEl.textContent = TOTAL - count;
    sumEl.textContent = sum.toLocaleString('pt-BR');
  }

  function toggle(n) {
    if (state[n]) delete state[n];
    else state[n] = true;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    render();
  }

  function resetar() {
    if (confirm('Tem certeza que quer apagar TUDO?')) {
      state = {};
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      render();
    }
  }

  function exportar() {
    const feitos = Object.keys(state).map(n => 'Depósito #' + n).join('\n') || 'Nenhum depósito registrado.';
    const count = Object.keys(state).length;
    const sum = Object.keys(state).reduce((acc, n) => acc + Number(n), 0);
    const txt = 'RELATÓRIO DO DESAFIO 40.000\nData: ' + new Date().toLocaleString('pt-BR') +
                '\nTotal feitos: ' + count + '/' + TOTAL +
                '\nSoma dos valores: ' + sum.toLocaleString('pt-BR') +
                '\n\n' + feitos;
    const blob = new Blob([txt], {type:'text/plain'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'desafio_40000_' + Date.now() + '.txt';
    a.click();
  }

  render();
</script>
</body>
</html>
